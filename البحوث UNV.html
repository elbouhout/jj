.big{display:block;text-align:center;font-size:1.1rem;padding:14px;margin:16px 0}

async function getText(f){

}

    else{var bj=bi+(a==='bup'?-1:1);if(bj>=0&&bj<L.length){var tb=L[bi];L[bi]=L[bj];L[bj]=tb}}
    render();
  }
  else if(a==='bqr'||a==='bvid'){var bk2=path.join('/')||'_';D.blocks=D.blocks||{};(D.blocks[bk2]=D.blocks[bk2]||[]).push(a==='bqr'?{t:'qr',v:'',u:'',img:''}:{t:'vids',v:'',l:[{n:'',u:''}]});render()}
  else if(a==='qrgen'){var Lq=(D.blocks&&D.blocks[path.join('/')||'_'])||[],bq=Lq[+b.dataset.bi];if(bq&&bq.u){setSt('جارٍ توليد الكود…');try{bq.img=await qrImg(bq.u);status='تم توليد الكود. لا تنسَ "حفظ ونشر".';render()}catch(err){setSt('تعذّر توليد الكود، تحقق من الاتصال وحاول مرة أخرى')}}else setSt('اكتب الرابط أو النص أولاً')}
  else if(a==='vadd'||a==='vup'||a==='vdn'||a==='vdel'){var Lv=(D.blocks&&D.blocks[path.join('/')||'_'])||[],bv=Lv[+b.dataset.bi];if(bv){bv.l=bv.l||[];var vi=+b.dataset.vi;if(a==='vadd')bv.l.push({n:'',u:''});else if(a==='vdel')bv.l.splice(vi,1);else{var vj=vi+(a==='vup'?-1:1);if(vj>=0&&vj<bv.l.length){var tv=bv.l[vi];bv.l[vi]=bv.l[vj];bv.l[vj]=tv}}render()}}
  else if(a==='bzone'){var Lz=(D.blocks&&D.blocks[path.join('/')||'_'])||[],bz=Lz[+b.dataset.bi];if(bz)bz.p=bz.p==='b'?'':'b';render()}
  else if(a==='pick'){document.getElementById('up').click()}
  else if(a==='img'){imgKey=b.dataset.p;document.getElementById('imgup').value='';document.getElementById('imgup').click()}
  else if(a==='rmimg'){var o0=D.imgs&&D.imgs[b.dataset.p];if(o0){removed.push(o0.id);delete D.imgs[b.dataset.p]}render()}
  else if(a==='cancel'){D=JSON.parse(saved);OKM=null;delKey='';removed=[];edit=false;status='';render()}
  else if(a==='up'||a==='down'){var c0=ct(D.files[i]),j=i;do{j+=(a==='up'?-1:1)}while(j>=0&&j<D.files.length&&ct(D.files[j])!==c0);if(j>=0&&j<D.files.length){var tt0=D.files[i];D.files[i]=D.files[j];D.files[j]=tt0}render()}
  else if(a==='del'){var id=D.files[i].id,p=removed.indexOf(id);if(p>-1)removed.splice(p,1);else removed.push(id);render()}
  else if(a==='save'){
    if(!artifact){setSt('ميزة النشر غير متاحة');return}
    busy=true;render();setSt('جارٍ النشر…');
    try{
      var keep=D.files.filter(function(f){return removed.indexOf(f.id)<0});
      var del=removed.slice();D.files=keep;
      for(var k=0;k<del.length;k++){try{await assets.delete(del[k])}catch(x){}}
      await artifact.publish(buildHtml(D));
    }catch(err){busy=false;setSt('فشل الحفظ: '+(err&&err.message?err.message:'خطأ'));render()}
  }
});
render();
(async function(){
  try{
    if(!window.claude)return;
    try{dl=await claude.use('downloads')}catch(e){}
    var u=await claude.use('user');
    if(u){canEdit=!!((await u.isOwner())||(await u.canEdit()))}
    if(canEdit){assets=await claude.use('assets');artifact=await claude.use('artifact');if(!assets||!artifact)canEdit=false}
    render();
  }catch(e){}
})();
})();
